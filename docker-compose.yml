services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: elyx
      POSTGRES_PASSWORD: elyxsecret
      POSTGRES_DB: elyx
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U elyx -d elyx"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elyx-net

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://elyx:elyxsecret@db:5432/elyx
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    expose:
      - "3001"
    networks:
      - elyx-net

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - elyx-net

volumes:
  pgdata:

networks:
  elyx-net:
    driver: bridge
