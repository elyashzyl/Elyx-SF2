services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootsecret
      MYSQL_DATABASE: elyx
      MYSQL_USER: elyx
      MYSQL_PASSWORD: elyxsecret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysqldata:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -prootsecret"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - elyx-net

  app:
    build:
      context: .
      target: app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: mysql://elyx:elyxsecret@db:3306/elyx
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3001
    expose:
      - "3001"
    networks:
      - elyx-net

  web:
    build:
      context: .
      target: web
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - elyx-net

volumes:
  mysqldata:

networks:
  elyx-net:
    driver: bridge