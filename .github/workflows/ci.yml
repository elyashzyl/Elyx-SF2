name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Verify application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DB_CONNECTION: sqlite
      DATABASE_URL: ''
      MYSQL_URL: ''
      MYSQL_CONNECTION_URL: ''
      DB_URL: ''
      MYSQL_URI: ''
      DB_URI: ''
      REQUIRE_MYSQL: '0'
      DB_PATH: ${{ runner.temp }}/elytrack-test.db

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Check migration status
        run: npm run db:migrate:status

      - name: Run test suite
        run: npm test

      - name: Build frontend
        run: npm run build

      - name: Check generated and source files
        run: git diff --check

  mysql-integration:
    name: Verify Prisma reads against isolated MySQL
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: rootpassword
          MYSQL_DATABASE: elytrack_testing
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -prootpassword"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=12

    env:
      NODE_ENV: test
      DB_CONNECTION: mysql
      DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/elytrack_testing
      REQUIRE_MYSQL: '1'
      PRISMA_MYSQL_INTEGRATION: '1'
      PRISMA_TEST_DATABASE_URL: mysql://root:rootpassword@127.0.0.1:3306/elytrack_testing

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci --include=dev --include=optional

      - name: Apply schema migrations to isolated database
        run: npm run db:migrate

      - name: Verify migrated schema without writes
        run: npm run db:verify-schema

      - name: Run Prisma read-slice integration test
        run: node --test tests/prisma-read-slices.mysql.test.mjs
