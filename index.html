<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/elytrack-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ElyTrack — School Attendance & Operations</title>
    <style>
      :root {
        --bg-preload: #f8faf9;
        --fg-preload: #091214;
      }
      [data-theme="dark"] {
        --bg-preload: #090e0f;
        --fg-preload: #edf5f5;
      }
      html, body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background-color: var(--bg-preload);
        color: var(--fg-preload);
      }
      #app {
        min-height: 100vh;
      }
    </style>
    <script>
      try {
        var t = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', t);
        document.documentElement.style.colorScheme = t;
      } catch (e) {}
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Lora:ital,wght@0,400..700;1,400..700&display=swap" rel="stylesheet">
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
